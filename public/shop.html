  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/color.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>

<body class="home">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light bg-opacity-75 fixed-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">Stable Quest</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="myHorses.html">My Horses</a></li>
        <li class="nav-item"><a class="nav-link active" href="shop.html">Gacha</a></li>
        <li class="nav-item"><a class="nav-link" href="wellnessChallenge.html">Challenges</a></li>
        <li class="nav-item"><a class="nav-link" href="badge.html">Achievements</a></li>
        <li class="nav-item d-none" id="navProfile"><a class="nav-link" href="profile.html">Profile</a></li>

      </ul>
    </div>
  </div>
</nav>

<!-- Page content -->
<main class="container py-4" style="padding-top:90px;">
  <div class="mt-5 pt-4">  
    <div class="row justify-content-center">

      <div class="text-center mb-4">
        <h1 class="fw-bold" style="font-family:'Sour Gummy', cursive;">Gacha</h1>
        <p class="text-muted">Spend coins to summon a random horse!</p>
      </div>

      <div id="alertBox" class="alert d-none" role="alert"></div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5 text-center">

          <div class="mb-3">
            <div class="fw-semibold">
              Your Coins:
              <span id="displayCoins" class="fs-4 fw-bold">0</span>
            </div>
          </div>
          <div class="mb-3">
            <img
              src="/gacha.png"
              alt="Gacha Banner"
              class="img-fluid rounded-4 shadow-sm gacha-img"
            >
          </div>
          <div class="mb-4">
            <button id="pullBtn" class="btn btn-warning btn-lg fw-bold w-100">
              Pull Gacha (75 coins)
            </button>
          </div>

          <!-- Result -->
          <div id="resultBox" class="d-none">
            <hr>
            <h4 class="fw-bold">You got:</h4>
            <p class="mb-1">
              <span id="horseName" class="fw-bold fs-5"></span>
            </p>
            <p class="text-muted mb-0">
              Rarity: <span id="horseRarity"></span>
            </p>
          </div>

        </div>
      </div>

    </div>
  </div>
</main>

<footer class="mt-auto py-4">
  <div class="container text-center">
    <p class="mb-1">Horse Racing Championship © 2026</p>
    <p class="small">Train your dream horses and become the ultimate champion</p>
  </div>
</footer>
